version: 2
updates:
  # Python 依賴（含 yt-dlp 等需要保持更新的套件）
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # gitleaks-action v3 在此設定下會誤判失敗；維持可正常運作的 v2
      - dependency-name: "gitleaks/gitleaks-action"
        update-types: ["version-update:semver-major"]

[project]
name = "lorekeeper"
version = "0.2.0"
description = "Turn group chats into a structured knowledge base — a pluggable, fully-async LLM pipeline"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "kiresakura" }]
keywords = [
    "llm",
    "knowledge-base",
    "notion",
    "line-bot",
    "fastapi",
    "async",
    "ports-and-adapters",
    "hexagonal-architecture",
]
dependencies = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "notion-client>=2.0",
    "openai>=2.44.0",
    "httpx>=0.28.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "beautifulsoup4>=4.15.0",
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.scripts]
lorekeeper = "lorekeeper.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lorekeeper*"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
